services:
  mailer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailer-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - mailer-network

  redis:
    image: redis:7-alpine
    container_name: mailer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mailer-network

volumes:
  redis-data:

networks:
  mailer-network:
    driver: bridge
